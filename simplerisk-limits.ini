upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
max_execution_time = 120
max_input_vars = 3000

; Hide the PHP version from response headers (mirrors nginx server_tokens off and the old
; Apache ServerTokens Prod). Applies to every SAPI; harmless for CLI.
expose_php = Off

; Production-standard error reporting (this is exactly what php.ini-production ships):
; surface notices/warnings/errors, but NOT E_DEPRECATED. PHP 8.4 floods deprecations from
; bundled libraries (e.g. Prophecy inside the test phar) and legacy app code. Letting them
; emit to stderr also deadlocks PHPUnit @runInSeparateProcess children — the child's stderr
; pipe fills, the child blocks on the write, and the parent blocks reading stdout. Real
; app deprecations are better addressed in a dedicated pre-PHP-9 cleanup pass than logged
; ad hoc. (display_errors stays off for FPM in the pool config; CLI keeps it on.)
; Because this ini is global (all SAPIs, including CLI), deprecations are hidden from CLI
; dev too. To see them on a one-off CLI run, override on the command line:
;   php -d error_reporting=E_ALL -r '...'
; (don't run the PHPUnit suite this way — that re-opens the pipe deadlock above).
error_reporting = E_ALL & ~E_DEPRECATED
