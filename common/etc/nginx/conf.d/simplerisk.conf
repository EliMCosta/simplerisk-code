# SimpleRisk application vhost.
#
# Translates the Apache vhosts (common/etc/apache2/sites-enabled/{000-default,default-ssl}.conf)
# and every .htaccess (simplerisk/{api,vendor,includes,api/v2/includes}/..., tests/.htaccess)
# into nginx.
#
# Routing: the REST API uses the Leaf framework, which resolves routes from
# $_SERVER['REQUEST_URI'] (vendor/leafs/leaf/src/Router.php). The old .htaccess
# `?__route__=` rewrite param is vestigial (no reader), so the front-controller pattern
# is the canonical `try_files ... /api/<v>/index.php$is_args$args` — REQUEST_URI is
# preserved unchanged across the internal redirect.
#
# NOTE on syntax: the php:8.4-fpm base is Debian trixie, which ships nginx 1.26, so we
# use the modern `http2 on;` directive (added in nginx 1.25.1) rather than the deprecated
# `listen 443 ssl http2;` form.

upstream simplerisk_php {
    # php:8.4-fpm default pool listens on 127.0.0.1:9000 (TCP). TCP-on-loopback avoids
    # the socket-permission coordination between the simplerisk (nginx) and the pool
    # users in this non-root single container, for negligible overhead.
    server 127.0.0.1:9000;
    keepalive 16;
}

# ---- :80  ->  HTTPS redirect (translates 000-default.conf) ----
server {
    listen 80 default_server;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- :443 main vhost (translates default-ssl.conf + all .htaccess) ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    root  /var/www/simplerisk;
    index index.php index.html;

    # TLS — certs generated at runtime by entrypoint generate_ssl_certs() into the
    # bind-mounted /etc/nginx/ssl (./certs on the host). Filenames mirror Apache's.
    ssl_certificate     /etc/nginx/ssl/simplerisk/simplerisk.crt;
    ssl_certificate_key /etc/nginx/ssl/simplerisk/simplerisk.key;

    # HSTS is the ONLY security header set here. Everything else — X-Frame-Options,
    # X-XSS-Protection, X-Content-Type-Options, Referrer-Policy, and the dynamic CSP — is
    # emitted per request by add_security_headers() in includes/functions.php (and PHP never
    # sends HSTS, so it must live in nginx). Apache's `Header always set` REPLACES, so its
    # vhost could also set the others safely; nginx `add_header` APPENDS, which produced
    # duplicate (and, for Referrer-Policy, conflicting) headers — hence they are omitted here.
    # NB: use only `expires` (never `add_header`) in the static locations below, so this
    # stays inherited — an `add_header` inside a location would drop the server-level one.
    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;

    # ---- Library/test/code dirs: deny direct access (translate .htaccess denies) ----
    # ^~ prefix locations win over the regex PHP/static locations, so PHP can never run here.
    # simplerisk/includes/.htaccess + simplerisk/api/v2/includes/.htaccess -> /404
    location ^~ /includes/        { return 404; }
    location ^~ /api/v2/includes/ { return 404; }
    # tests/.htaccess (Require all denied) -> 403
    location ^~ /tests/           { deny all; return 403; }

    # ---- /vendor/: deny all library/PHP code by default (translate vendor/.htaccess) ----
    # PLAIN prefix (NOT ^~) so the regex allowlist locations below can override it for the
    # specific static-asset subtrees the UI references. The catch-all PHP location
    # (^(?!/vendor/).+\.php$) excludes /vendor/ entirely, so no vendor PHP can ever execute.
    location /vendor/ {
        deny all;
        return 403;
    }
    # Allowlisted vendor STATIC assets (mirror the vendor/.htaccess negative-lookahead). Each
    # serves the file as-is via the vendor-static snippet; none set fastcgi_pass, so a stray
    # .php in an allowlisted dir stays inert (never executed).
    location = /vendor/simplerisk/csrf-magic/csrf-magic.js   { include /etc/nginx/snippets/vendor-static.conf; }
    location ^~ /vendor/components/font-awesome/             { include /etc/nginx/snippets/vendor-static.conf; }
    # SimpleSAMLphp: serve public/ static assets. SAML is dormant in this LDAP-auth stack;
    # if it is ever enabled, its PHP entry points would need explicit fastcgi routing
    # added here (there is no www/ -> public/ rewrite: only public/ exists on disk, and a
    # rewrite would also be insufficient — SAML needs PHP execution, not a static serve).
    location ^~ /vendor/simplesamlphp/simplesamlphp/public/ { include /etc/nginx/snippets/vendor-static.conf; }
    # node_modules static-asset families (js/css/map/fonts/images) — one regex, grouped.
    location ~ ^/vendor/node_modules/(chart\.js/dist|sigma/dist|graphology/dist|bootstrap-table/dist|bootstrap-table/extensions|bootstrap/dist/(css|js)|bootstrap/scss|bootstrap-multiselect/dist/(js|css)|datatables\.net/js|datatables\.net-bs5/(js|css|images)|datatables\.net-(rowgroup|rowreorder)(-bs5)?/(js|css)|jquery/dist|jquery-ui/dist|moment/min|daterangepicker|select2/dist/(css|js)|@selectize/selectize/dist/(css|js)|sorttable|block-ui|hugerte|toastr/build|gridstack/dist|@mdi/font/(css|fonts)|@fontsource)/ {
        include /etc/nginx/snippets/vendor-static.conf;
    }
    # duosecurity JS (+ one demo CSS), swagger-ui dist.
    location ~ ^/vendor/(duosecurity/duo_php/(js|demos/simple)|swagger-api/swagger-ui/dist)/ {
        include /etc/nginx/snippets/vendor-static.conf;
    }

    # ---- REST API: per-version Leaf front controllers ----
    # Non-file paths route to that version's index.php; REQUEST_URI is preserved so Leaf
    # resolves the route. Existing .php files fall through to the catch-all PHP location
    # below (so direct /api/v2/index.php access executes rather than source-disclosing).
    location /api/    { try_files $uri $uri/ /api/index.php$is_args$args; }
    location /api/v1/ { try_files $uri $uri/ /api/v1/index.php$is_args$args; }
    location /api/v2/ { try_files $uri $uri/ /api/v2/index.php$is_args$args; }

    # ---- Static asset dirs (served straight to browsers, long cache) ----
    location ^~ /css/     { expires 7d; }
    location ^~ /js/      { expires 7d; }
    location ^~ /images/  { expires 7d; }

    # ---- Docroot front controller (translates the implicit simplerisk/.htaccess) ----
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # ---- PHP execution: index.php, /api/*/index.php, /extras/upgrade/index.php, etc. ----
    # Excludes /vendor/ via negative lookahead so vendor PHP is never executed or
    # source-disclosed. 600s timeout + no buffering: one_click_upgrade / extras/upgrade
    # stream progress for up to set_time_limit(600) (includes/api.php:10327); the nginx/FPM
    # 60s defaults would 504. HTTPS is always on in this server, so pass it explicitly
    # (FPM does not set $_SERVER['HTTPS'] automatically like mod_php does).
    # Override SERVER_NAME/SERVER_PORT: `server_name _` is a catch-all marker, not the
    # client hostname. SimpleRisk derives simplerisk_base_url (and JS BASE_URL) from these.
    location ~ ^(?!/vendor/).+\.php$ {
        fastcgi_pass  simplerisk_php;
        include       /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS           on;
        fastcgi_param SERVER_NAME     $host;
        fastcgi_param SERVER_PORT     $simplerisk_server_port;
        fastcgi_read_timeout 600s;
        fastcgi_buffering    off;
        fastcgi_keep_conn    on;
    }

    # Never expose dotfiles (well-known excluded).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
