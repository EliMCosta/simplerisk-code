# SimpleRisk global nginx config.
#
# nginx runs NON-ROOT: the image is `USER simplerisk` and supervisord launches
# `/usr/sbin/nginx -g 'daemon off;'` as that user. Because nginx is started non-root,
# the `user` directive is forbidden and intentionally omitted — the master and all
# workers run as the invoking uid (simplerisk, uid 1000), matching the file ownership
# model (chown simplerisk:www-data). Low-port binding (:80/:443) is granted by
# setcap CAP_NET_BIND_SERVICE on /usr/sbin/nginx in the Dockerfile.

worker_processes auto;
pid /tmp/nginx.pid;                 # /tmp is always writable by non-root
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;              # mirrors Apache ServerTokens Prod / ServerSignature Off

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 64M;        # match simplerisk-limits.ini upload/post limits

    # SimpleRisk builds simplerisk_base_url from SERVER_NAME + SERVER_PORT. The vhost uses
    # `server_name _` (catch-all), which nginx passes literally to PHP-FPM. When the client
    # sends Host: localhost:8443 (Podman maps host 8443 -> container 443), reflect the
    # port from the Host header so auto-detected URLs include :8443.
    map $http_host $simplerisk_server_port {
        ~:(?<hostport>\d+)$ $hostport;
        default              $server_port;
    }

    # TLS defaults (mirror Apache SSLProtocol -all +TLSv1.2 +TLSv1.3).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/conf.d/*.conf;
}
