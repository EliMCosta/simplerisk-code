# Included inside an allowlisted /vendor/ location to serve a static asset.
#
# Static only: the catch-all PHP location in simplerisk.conf excludes /vendor/
# entirely (^(?!/vendor/).+\.php$), so no vendor .php can ever execute. As defense in
# depth, also refuse to *serve* a stray .php (which would source-disclose it) — 403
# instead of letting try_files stream the raw source. (`if ... return` is one of
# nginx's safe `if` uses; a nested location would be illegal inside the regex allowlist
# locations that include this snippet.)
if ($uri ~* \.php$) { return 403; }
try_files $uri =404;
