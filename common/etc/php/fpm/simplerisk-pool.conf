; SimpleRisk www pool overrides. Installed as /usr/local/etc/php-fpm.d/zz-simplerisk.conf
; (zz- prefix => loads AFTER the base www.conf and overrides its [www] settings).
;
; The image is `USER simplerisk`, so the FPM master runs as simplerisk (uid 1000). A
; non-root master cannot setuid, so workers inherit the master uid; we therefore set
; user=simplerisk explicitly (a no-op uid change, clean) and group=www-data (simplerisk
; is a member of www-data, so setgid is allowed). This replicates the old Apache model
; exactly (APACHE_RUN_USER=simplerisk / APACHE_RUN_GROUP=www-data), so the 700-owner
; /var/www/simplerisk tree stays readable/writable by the workers.

[www]
user   = simplerisk
group  = www-data

; Keep the base TCP listener so nginx fastcgi_pass 127.0.0.1:9000 works.
listen = 127.0.0.1:9000

; Dynamic pool — the base image ships max_children=5 (tiny). Lift for the dev stack so
; concurrent browser tabs + the upgrade streaming worker don't queue. Conservative;
; tune from observation (each worker can use up to memory_limit=256M).
pm = dynamic
pm.max_children     = 20
pm.start_servers    = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Long-running endpoints: one_click_upgrade / extras/upgrade do set_time_limit(600) with
; streamed output. Cap the FPM side at 600s to match; nginx fastcgi_read_timeout=600s
; matches on its side. Without this, nginx's 60s default would 504 to the browser.
request_terminate_timeout = 600

; Slow-log to stderr (supervisord captures it) for diagnosing stalled long endpoints.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 30s

; --- Production-safe error logging (operator choice) ---
; The web SAPI must never emit error text to the response body — that is the documented
; cause of JSON/API responses getting corrupted by notices/deprecations (fixed several
; times in this stack, and PHP 8.4 adds NEW deprecations). display_errors=off routes all
; errors to the FPM error log -> stderr -> `podman logs` instead. CLI/tests keep the
; compiled-default display_errors (on) for debugging (these php_admin_flag/php_flag apply
; to the FPM www pool only).
php_admin_flag[display_errors]         = off
php_admin_flag[display_startup_errors] = off
php_flag[log_errors]                   = on
