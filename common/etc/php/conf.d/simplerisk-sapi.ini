; Load the apache_request_headers()/getallheaders() polyfill for every web request.
;
; Required under the FPM SAPI: neither function is registered for php-fpm (PHP Bug
; #62596), yet SimpleRisk's csrf_startup() (includes/functions.php) and csrf-magic's
; csrf_check() call apache_request_headers() on every CSRF-gated request. See
; /docker/sapi_compat.php.
;
; auto_prepend_file applies to EVERY SAPI, including CLI (cron, the PHPUnit suite) —
; it is NOT ignored under CLI. It is effectively web-only because $_SERVER has no HTTP_*
; keys under CLI and the polyfilled functions are function_exists()-guarded, so the shim
; is a harmless no-op there. Zero core/vendor edits.
auto_prepend_file = /docker/sapi_compat.php
